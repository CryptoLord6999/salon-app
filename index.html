<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись в Салон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); margin: 0; padding: 20px; }
        h2 { margin-top: 0; }
        .card { background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .option { display: flex; justify-content: space-between; padding: 12px; background: var(--tg-theme-bg-color, #fff); margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .option:active { opacity: 0.7; }
        .option.selected { border: 2px solid var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-color, #3390ec); font-weight: bold; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); font-size: 16px; }
        
        #submit-btn {
            width: 100%; padding: 15px; background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <h2>💇‍♀️ Запись онлайн</h2>
    
    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Услуга:</div>
        <div class="option" onclick="select(this, 'service', 'Стрижка', 1500)">Стрижка <span>1500₽</span></div>
        <div class="option" onclick="select(this, 'service', 'Маникюр', 2000)">Маникюр <span>2000₽</span></div>
        <div class="option" onclick="select(this, 'service', 'Окрашивание', 5000)">Окрашивание <span>5000₽</span></div>
    </div>

    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Время:</div>
        <div style="display:flex; gap:5px; flex-wrap:wrap;">
            <div class="option" style="flex:1; justify-content:center;" onclick="select(this, 'time', '10:00')">10:00</div>
            <div class="option" style="flex:1; justify-content:center;" onclick="select(this, 'time', '14:00')">14:00</div>
            <div class="option" style="flex:1; justify-content:center;" onclick="select(this, 'time', '18:00')">18:00</div>
        </div>
    </div>

    <div class="card">
        <input type="text" id="name" placeholder="Ваше имя" oninput="checkForm()">
    </div>

    <button id="submit-btn" onclick="sendData()" disabled>ЗАПИСАТЬСЯ</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // !!! ВСТАВЬ СЮДА СВОЙ ТОКЕН И ID КАНАЛА (как в bot.py) !!!
        const API_TOKEN = "8717717565:AAGDVp8ce7TUDFP0oTuMRoNe5NkSQp5DXhM"; 
        const CHANNEL_ID = "-1003932293179"; 
        // -------------------------------------------------------

        let data = { service: null, price: null, time: null };

        function select(el, type, val, price) {
            let siblings = el.parentElement.children;
            for(let sib of siblings) sib.classList.remove('selected');
            el.classList.add('selected');
            
            if(type === 'service') { data.service = val; data.price = price; }
            if(type === 'time') data.time = val;
            
            checkForm();
            tg.HapticFeedback.impactOccurred('light');
        }

        function checkForm() {
            const name = document.getElementById('name').value;
            const btn = document.getElementById('submit-btn');
            btn.disabled = !(data.service && data.time && name.length > 0);
        }

        function sendData() {
            const name = document.getElementById('name').value;
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = "Отправка...";

            const result = {
                service: data.service,
                price: data.price,
                time: data.time,
                name: name,
                username: tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Аноним"
            };

            // СПОСОБ 1: Стандартная отправка данных боту (он поймает это как web_app_data)
            tg.sendData(JSON.stringify(result));

            // СПОСОБ 2: Прямая отправка в канал через API (Дубль надежности)
            // Это гарантирует, что заявка уйдет, даже если бот "спит" или глючит
            if (API_TOKEN !== "8717717565:AAGDVp8ce7TUDFP0oTuMRoNe5NkSQp5DXhM") {
                const text = `🔥 <b>НОВАЯ ЗАПИСЬ (Direct)</b>\n👤 ${result.username}\n💇‍♀️ ${result.service}\n⏰ ${result.time}`;
                
                fetch(`https://api.telegram.org/bot${API_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHANNEL_ID,
                        text: text,
                        parse_mode: 'HTML'
                    })
                })
                .then(response => {
                    if(response.ok) {
                        status.innerText = "✅ Заявка отправлена!";
                        status.style.color = "green";
                        setTimeout(() => tg.close(), 1500);
                    } else {
                        status.innerText = "⚠️ Ошибка сети";
                        status.style.color = "red";
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    status.innerText = "⚠️ Ошибка соединения";
                    btn.disabled = false;
                });
            } else {
                status.innerText = "⚠️ Нет токена в HTML";
            }
        }
    </script>
</body>
</html>
