<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0; padding: 20px;
        }
        h2 { margin-top: 0; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .option {
            padding: 12px;
            background: var(--tg-theme-bg-color, #fff);
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; justify-content: space-between;
        }
        .option.selected {
            border: 2px solid var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-color, #3390ec);
            font-weight: bold;
        }
        input {
            width: 100%; padding: 12px;
            border-radius: 8px; border: 1px solid #ccc;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            box-sizing: border-box;
        }
        /* ГЛАВНАЯ КНОПКА ВНУТРИ СТРАНИЦЫ */
        #submit-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            display: none; /* Скрыта пока не заполнено */
        }
        #submit-btn:active { opacity: 0.8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>💇‍♀️ Запись онлайн</h2>
    
    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Услуга:</div>
        <div class="option" onclick="select('service', this, 'Стрижка', 1500)">Стрижка <span>1500₽</span></div>
        <div class="option" onclick="select('service', this, 'Маникюр', 2000)">Маникюр <span>2000₽</span></div>
        <div class="option" onclick="select('service', this, 'Окрашивание', 5000)">Окрашивание <span>5000₽</span></div>
    </div>

    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Время:</div>
        <div class="option" onclick="select('time', this, '10:00')">10:00</div>
        <div class="option" onclick="select('time', this, '14:00')">14:00</div>
        <div class="option" onclick="select('time', this, '18:00')">18:00</div>
    </div>

    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Ваше имя:</div>
        <input type="text" id="name" placeholder="Иван" oninput="check()">
    </div>

    <button id="submit-btn" onclick="sendData()">ЗАПИСАТЬСЯ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let data = { service: null, price: null, time: null };

        function select(type, el, val, price) {
            // Сброс выделения в группе
            let parent = el.parentElement;
            Array.from(parent.children).forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');

            if(type === 'service') {
                data.service = val;
                data.price = price;
            } else {
                data.time = val;
            }
            check();
        }

        function check() {
            const name = document.getElementById('name').value;
            const btn = document.getElementById('submit-btn');
            if(data.service && data.time && name.length > 2) {
                btn.style.display = 'block';
                btn.innerText = `Записаться на ${data.service} (${data.time})`;
            } else {
                btn.style.display = 'none';
            }
        }

        function sendData() {
            const name = document.getElementById('name').value;
            const result = {
                name: name,
                service: data.service,
                time: data.time,
                price: data.price
            };
            
            // Блокируем кнопку
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Отправка...";

            // ОТПРАВЛЯЕМ ДАННЫЕ БОТУ
            tg.sendData(JSON.stringify(result));
            
            // Показываем стандартное окно успеха Telegram
            tg.showPopup({
                title: 'Готово!',
                message: 'Ваша заявка отправлена администратору.',
                buttons: [{type: 'ok'}]
            }, () => {
                tg.close(); // Закрываем приложение
            });
        }
    </script>
</body>
</html>
