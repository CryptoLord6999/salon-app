<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись в Салон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 20px; }
        .card { background: var(--tg-theme-secondary-bg-color, #eee); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .opt { display: flex; justify-content: space-between; padding: 12px; background: var(--tg-theme-bg-color, #fff); margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .opt.selected { border: 2px solid var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-color, #3390ec); font-weight: bold; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--tg-theme-button-color, #3390ec); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 20px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <h2>💇‍♀️ Запись онлайн</h2>
    <div class="card">
        <b>Услуга:</b>
        <div class="opt" onclick="set(this, 's', 'Стрижка', 1500)">Стрижка <span>1500₽</span></div>
        <div class="opt" onclick="set(this, 's', 'Маникюр', 2000)">Маникюр <span>2000₽</span></div>
    </div>
    <div class="card">
        <b>Время:</b>
        <div style="display:flex; gap:5px;">
            <div class="opt" style="flex:1; justify-content:center;" onclick="set(this, 't', '10:00')">10:00</div>
            <div class="opt" style="flex:1; justify-content:center;" onclick="set(this, 't', '14:00')">14:00</div>
            <div class="opt" style="flex:1; justify-content:center;" onclick="set(this, 't', '18:00')">18:00</div>
        </div>
    </div>
    <div class="card"><input type="text" id="name" placeholder="Ваше имя"></div>
    <button id="btn" onclick="send()" disabled>ЗАПИСАТЬСЯ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let d = {s:null, p:null, t:null};

        function set(el, k, v, p) {
            el.parentElement.querySelectorAll('.opt').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            if(k==='s') { d.s=v; d.p=p; } else { d.t=v; }
            check();
        }

        function check() {
            const n = document.getElementById('name').value;
            document.getElementById('btn').disabled = !(d.s && d.t && n);
        }
        document.getElementById('name').addEventListener('input', check);

        function send() {
            const n = document.getElementById('name').value;
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "Отправка...";

            const data = {
                service: d.s,
                price: d.p,
                time: d.t,
                name: n
            };

            // ЕДИНСТВЕННЫЙ СПОСОБ: Отправка данных боту
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
