<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись в Салон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); margin: 0; padding: 20px; }
        h2 { margin-top: 0; }
        .card { background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .option { display: flex; justify-content: space-between; padding: 12px; background: var(--tg-theme-bg-color, #fff); margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .option.selected { border: 2px solid var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-color, #3390ec); font-weight: bold; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); font-size: 16px; }
        
        #submit-btn {
            width: 100%; padding: 15px; background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; opacity: 0.5; pointer-events: none;
        }
        #submit-btn.active { opacity: 1; pointer-events: all; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <h2>💇‍♀️ Запись онлайн</h2>
    
    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Услуга:</div>
        <div class="option" onclick="select(this, 'service', 'Стрижка', 1500)">Стрижка <span>1500₽</span></div>
        <div class="option" onclick="select(this, 'service', 'Маникюр', 2000)">Маникюр <span>2000₽</span></div>
        <div class="option" onclick="select(this, 'service', 'Окрашивание', 5000)">Окрашивание <span>5000₽</span></div>
    </div>

    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Время:</div>
        <div style="display:flex; gap:5px; flex-wrap:wrap;">
            <div class="option" style="flex:1;" onclick="select(this, 'time', '10:00')">10:00</div>
            <div class="option" style="flex:1;" onclick="select(this, 'time', '14:00')">14:00</div>
            <div class="option" style="flex:1;" onclick="select(this, 'time', '18:00')">18:00</div>
        </div>
    </div>

    <div class="card">
        <input type="text" id="name" placeholder="Ваше имя" oninput="checkForm()">
    </div>

    <button id="submit-btn" onclick="sendData()">ЗАПИСАТЬСЯ</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // ВАЖНО: Вставь сюда ТОКЕН своего бота, чтобы работал прямой запрос
        const BOT_TOKEN = "8717717565:AAEwrbJp2OZ9Azt3uoy9fNR6hGZcEJpKL3Y"; 
        // Примечание: В продакшене токен лучше скрывать на бэкенде, но для MVP и работы без сервера это необходимо
        
        let data = { service: null, price: null, time: null };

        function select(el, type, val, price) {
            let siblings = el.parentElement.children;
            for(let sib of siblings) sib.classList.remove('selected');
            el.classList.add('selected');
            
            if(type === 'service') { data.service = val; data.price = price; }
            if(type === 'time') data.time = val;
            
            checkForm();
            tg.HapticFeedback.impactOccurred('light');
        }

        function checkForm() {
            const name = document.getElementById('name').value;
            const btn = document.getElementById('submit-btn');
            if(data.service && data.time && name.length > 0) {
                btn.classList.add('active');
                btn.innerText = `Записаться на ${data.time}`;
            } else {
                btn.classList.remove('active');
            }
        }

        async function sendData() {
            const name = document.getElementById('name').value;
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.innerText = "Отправка...";
            
            const booking = {
                name: name,
                service: data.service,
                price: data.price,
                time: data.time,
                username: tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Клиент"
            };

            // СПОСОБ 1: Прямой HTTP запрос (Самый надежный!)
            try {
                const messageText = `🔥 <b>НОВАЯ ЗАПИСЬ!</b>\n\n👤 ${booking.username} (${booking.name})\n💇‍♀️ ${booking.service} (${booking.price}₽)\n⏰ ${booking.time}`;
                
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const params = {
                    chat_id: tg.initDataUnsafe.user.id, // Сначала шлем себе в личку для теста, бот перешлет в канал
                    text: messageText,
                    parse_mode: "HTML"
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(params)
                });

                if (response.ok) {
                    status.innerText = "✅ Успешно! Ждите подтверждения.";
                    status.style.color = "green";
                    
                    // Дополнительно пробуем стандартный метод для красоты закрытия окна
                    tg.sendData(JSON.stringify(booking));
                    setTimeout(() => tg.close(), 1500);
                } else {
                    throw new Error("Network error");
                }
            } catch (error) {
                console.error(error);
                status.innerText = "❌ Ошибка сети. Попробуйте еще раз.";
                status.style.color = "red";
                btn.disabled = false;
                btn.innerText = "ПОПРОБОВАТЬ СНОВА";
            }
        }
    </script>
</body>
</html>
