<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись в Салон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); margin: 0; padding: 20px; }
        h2 { margin-top: 0; font-size: 22px; font-weight: 800; }
        p { color: var(--tg-theme-hint-color, #999); font-size: 14px; margin-top: 0; margin-bottom: 20px; }
        .card { background-color: var(--tg-theme-secondary-bg-color, #f4f4f5); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .item { display: flex; justify-content: space-between; padding: 12px; background-color: var(--tg-theme-bg-color, #fff); margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .item:last-child { margin-bottom: 0; }
        .item.selected { border: 2px solid var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-color, #3390ec); font-weight: bold; }
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .time-slot { background-color: var(--tg-theme-bg-color, #fff); padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .time-slot.selected { background-color: var(--tg-theme-button-color, #3390ec); color: #fff; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); font-size: 16px; outline: none; }
        input:focus { border-color: var(--tg-theme-button-color, #3390ec); }
        #submit-btn { width: 100%; padding: 15px; background-color: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <h2>💇‍♀️ Запись онлайн</h2>
    <p>Выберите услугу и время</p>

    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Услуга:</div>
        <div class="item" onclick="select(this, 'Стрижка', 1500)">Стрижка <span>1500₽</span></div>
        <div class="item" onclick="select(this, 'Маникюр', 2000)">Маникюр <span>2000₽</span></div>
        <div class="item" onclick="select(this, 'Окрашивание', 5000)">Окрашивание <span>5000₽</span></div>
    </div>

    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Время:</div>
        <div class="time-grid">
            <div class="time-slot" onclick="selectTime(this, '10:00')">10:00</div>
            <div class="time-slot" onclick="selectTime(this, '14:00')">14:00</div>
            <div class="time-slot" onclick="selectTime(this, '18:00')">18:00</div>
        </div>
    </div>

    <div class="card">
        <div style="margin-bottom:10px; font-weight:bold;">Ваше имя:</div>
        <input type="text" id="name" placeholder="Иван">
    </div>

    <button id="submit-btn" onclick="sendData()" disabled>ЗАПИСАТЬСЯ</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ✅ ТОКЕН И КАНАЛ УЖЕ ВСТАВЛЕНЫ
        const BOT_TOKEN = "8717717565:AAGDVp8ce7TUDFP0oTuMRoNe5NkSQp5DXhM"; 
        const CHANNEL_ID = "-1003932293179";

        let srv = null, price = null, time = null;
        const nameInput = document.getElementById('name');
        const btn = document.getElementById('submit-btn');
        const status = document.getElementById('status');

        function select(el, s, p) {
            document.querySelectorAll('.item').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            srv = s; price = p;
            check();
        }

        function selectTime(el, t) {
            document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            time = t;
            check();
        }

        function check() {
            const isReady = srv && time && nameInput.value.trim().length > 0;
            btn.disabled = !isReady;
        }

        nameInput.addEventListener('input', check);

        function sendData() {
            if (!srv || !time) return;
            const name = nameInput.value.trim();
            
            btn.disabled = true;
            status.innerText = "Отправка...";

            const data = { service: srv, price: price, time: time, name: name };

            // 1. Отправка боту (основной метод)
            tg.sendData(JSON.stringify(data));
            
            // 2. Дубль напрямую в канал (для надежности)
            const text = `🔥 <b>НОВАЯ ЗАПИСЬ (Direct)</b>\n👤 ${name}\n💇‍♀️ ${srv}\n⏰ ${time}`;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: CHANNEL_ID, text: text, parse_mode: 'HTML' })
            }).then(res => {
                if(res.ok) {
                    status.innerText = "✅ Успешно!";
                    status.style.color = "green";
                    setTimeout(() => tg.close(), 1000);
                } else {
                    status.innerText = "⚠️ Ошибка сети";
                    btn.disabled = false;
                }
            }).catch(() => {
                status.innerText = "⚠️ Нет связи";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
