<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запись в салон</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin:0; padding:16px; font-family:-apple-system,sans-serif;
         background:var(--tg-theme-bg-color,#111); color:var(--tg-theme-text-color,#fff); }
  h2 { margin-top:0; }
  label { display:block; margin:12px 0 4px; font-size:14px; opacity:.8; }
  input, select { width:100%; box-sizing:border-box; padding:12px; border-radius:10px;
         border:1px solid var(--tg-theme-hint-color,#444);
         background:var(--tg-theme-secondary-bg-color,#1c1c1e);
         color:var(--tg-theme-text-color,#fff); font-size:16px; }
  button { width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px;
         background:var(--tg-theme-button-color,#3390ec);
         color:var(--tg-theme-button-text-color,#fff); font-size:17px; font-weight:600; }
</style>
</head>
<body>
<h2>💇 Запись в салон <span style="opacity:.5;font-size:12px">v3</span></h2>

<form id="bookingForm">
  <label>Ваше имя</label>
  <input id="name" type="text" placeholder="Иван">

  <label>Услуга</label>
  <select id="service">
    <option value="Стрижка|1500">Стрижка — 1500₽</option>
    <option value="Маникюр|2000">Маникюр — 2000₽</option>
    <option value="Окрашивание|3500">Окрашивание — 3500₽</option>
  </select>

  <label>Дата и время</label>
  <input id="time" type="text" placeholder="08.09.2026 10:00">

  <label>Цена (₽)</label>
  <input id="price" type="number" value="1500">

  <button type="submit">✅ Записаться</button>
</form>

<script>
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  // ВРЕМЕННЫЙ КОСТЫЛЬ ШАГА 1 (как в изначальной версии): страница сама шлёт в канал и клиенту.
  // УБРАТЬ на шаге 2, когда в трейсе стабильно появится IN web_app.
  var BOT_TOKEN = "8717717565:AAGDVp8ce7TUDFP0oTuMRoNe5NkSQp5DXhM";
  var CHANNEL_ID = "-1003932293179";
  var API = "https://api.telegram.org/bot" + BOT_TOKEN;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function notify(msg){ if (tg) { tg.showAlert(msg); } else { alert(msg); } }
  function tgSend(method, payload){
    return fetch(API + "/" + method, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).catch(function(){ return {ok:false}; });
  }

  document.getElementById('service').addEventListener('change', function(){
    document.getElementById('price').value = this.value.split('|')[1] || '';
  });

  document.getElementById('bookingForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var timeVal = document.getElementById('time').value.trim();
    if (!name || !timeVal) { notify('Заполните имя и время'); return; }

    var parts = document.getElementById('service').value.split('|');
    var payload = { name:name, service:parts[0], time:timeVal, price:document.getElementById('price').value };
    var user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;

    var channelText =
      "🔥 <b>НОВАЯ ЗАПИСЬ!</b>\n\n" +
      "👤 <b>Клиент:</b> " + esc(user ? (user.first_name || 'Клиент') : 'Клиент') +
      (user ? " (<code>" + user.id + "</code>)" : "") + "\n" +
      "📝 <b>Данные:</b>\n" +
      " • Услуга: " + esc(payload.service) + "\n" +
      " • Время: " + esc(payload.time) + "\n" +
      " • Цена: " + esc(payload.price) + "₽\n" +
      " • Имя: " + esc(payload.name) + "\n\n" +
      "📞 Свяжитесь с клиентом для подтверждения!";

    var jobs = [ tgSend("sendMessage", {chat_id: CHANNEL_ID, text: channelText, parse_mode: "HTML"}) ];
    if (user) {
      jobs.push(tgSend("sendMessage", {chat_id: user.id, parse_mode: "HTML",
        text: "✅ <b>Заявка принята!</b>\nНаш администратор скоро свяжется с вами."}));
    }

    // Сначала гарантированные отправки, ПОТОМ копия боту для трейса и закрытие
    Promise.all(jobs).then(function(){
      if (tg && tg.sendData) { try { tg.sendData(JSON.stringify(payload)); } catch (err) {} }
      if (tg) { tg.close(); }
    });
  });
</script>
</body>
</html>
