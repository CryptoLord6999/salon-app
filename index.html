<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запись в салон</title>
<!-- ОБЯЗАТЕЛЬНО: SDK Telegram Web App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin:0; padding:16px; font-family:-apple-system,sans-serif;
         background:var(--tg-theme-bg-color,#111); color:var(--tg-theme-text-color,#fff); }
  h2 { margin-top:0; }
  label { display:block; margin:12px 0 4px; font-size:14px; opacity:.8; }
  input, select { width:100%; box-sizing:border-box; padding:12px; border-radius:10px;
         border:1px solid var(--tg-theme-hint-color,#444);
         background:var(--tg-theme-secondary-bg-color,#1c1c1e);
         color:var(--tg-theme-text-color,#fff); font-size:16px; }
  button { width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px;
         background:var(--tg-theme-button-color,#3390ec);
         color:var(--tg-theme-button-text-color,#fff); font-size:17px; font-weight:600; }
</style>
</head>
<body>
<h2>💇 Запись в салон</h2>
<form id="bookingForm">
  <label>Ваше имя</label>
  <input id="name" type="text" placeholder="Иван" required>

  <label>Услуга</label>
  <select id="service">
    <option value="Стрижка">Стрижка — 1500₽</option>
    <option value="Маникюр">Маникюр — 2000₽</option>
    <option value="Окрашивание">Окрашивание — 3500₽</option>
  </select>

  <label>Дата и время</label>
  <input id="time" type="text" placeholder="2026-09-08 10:00" required>

  <label>Цена (₽)</label>
  <input id="price" type="number" value="1500">

  <button type="submit">✅ Записаться</button>
</form>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  document.getElementById('bookingForm').addEventListener('submit', function (e) {
    e.preventDefault();  // КЛЮЧЕВОЕ: не даём странице перезагрузиться

    const payload = {
      name:    document.getElementById('name').value.trim(),
      service: document.getElementById('service').value,
      time:    document.getElementById('time').value.trim(),
      price:   document.getElementById('price').value
    };

    if (!payload.name || !payload.time) {
      tg.showAlert('Заполните имя и время');
      return;
    }

    const json = JSON.stringify(payload);
    if (json.length > 4096) { tg.showAlert('Слишком длинные данные'); return; }

    tg.sendData(json);   // <-- вот это отправляет web_app_data в бота
    tg.close();          // закрываем Web App после отправки
  });
</script>
</body>
</html>
