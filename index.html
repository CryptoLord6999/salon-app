<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись в Салон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); margin: 0; padding: 20px; }
        h2 { margin-top: 0; }
        .card { background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .option { display: flex; justify-content: space-between; padding: 12px; background: var(--tg-theme-bg-color, #fff); margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .option.selected { border: 2px solid var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-color, #3390ec); font-weight: bold; }
        .time-grid { display: flex; gap: 5px; flex-wrap: wrap; }
        .time-slot { flex: 1; padding: 10px; text-align: center; background: #fff; border-radius: 8px; cursor: pointer; }
        .time-slot.selected { background: var(--tg-theme-button-color, #3390ec); color: #fff; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #000; }
        #submit-btn { width: 100%; padding: 15px; background: var(--tg-theme-button-color, #3390ec); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 20px; }
        #submit-btn:disabled { background: #ccc; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>💇‍♀️ Запись онлайн</h2>
    
    <div class="card">
        <b>Услуга:</b>
        <div class="option" onclick="select(this, 'Стрижка', 1500)">Стрижка <span>1500₽</span></div>
        <div class="option" onclick="select(this, 'Маникюр', 2000)">Маникюр <span>2000₽</span></div>
    </div>

    <div class="card">
        <b>Время:</b>
        <div class="time-grid">
            <div class="time-slot" onclick="selectTime(this, '10:00')">10:00</div>
            <div class="time-slot" onclick="selectTime(this, '14:00')">14:00</div>
            <div class="time-slot" onclick="selectTime(this, '18:00')">18:00</div>
        </div>
    </div>

    <div class="card"><input type="text" id="name" placeholder="Ваше имя"></div>

    <button id="submit-btn" onclick="sendData()" disabled>ЗАПИСАТЬСЯ</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ================= ВСТАВЬ ТОКЕН СЮДА =================
        const BOT_TOKEN = "8717717565:AAGDVp8ce7TUDFP0oTuMRoNe5NkSQp5DXhM"; // <-- ВСТАВЬ ТОЧНО СЮДА
        const CHANNEL_ID = "-1003932293179";
        // =====================================================

        let srv = null, price = null, time = null;

        function select(el, s, p) {
            document.querySelectorAll('.option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            srv = s; price = p;
            check();
        }

        function selectTime(el, t) {
            document.querySelectorAll('.time-slot').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            time = t;
            check();
        }

        function check() {
            const name = document.getElementById('name').value;
            document.getElementById('submit-btn').disabled = !(srv && time && name);
        }

        document.getElementById('name').addEventListener('input', check);

        function sendData() {
            const name = document.getElementById('name').value;
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = "Отправка...";

            const data = { service: srv, price: price, time: time, name: name };

            // 1. Пробуем отправить боту (стандартный метод)
            tg.sendData(JSON.stringify(data));

            // 2. ДУБЛЬ: Прямая отправка в канал (если токен верный)
            if (BOT_TOKEN.includes(":")) {
                const txt = `🔥 <b>НОВАЯ ЗАПИСЬ (DIRECT)</b>\n👤 ${name}\n💇‍♀️ ${srv}\n⏰ ${time}`;
                
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: CHANNEL_ID, text: txt, parse_mode: 'HTML' })
                })
                .then(res => {
                    if(res.ok) {
                        status.innerText = "✅ Успешно! (Direct)";
                        status.style.color = "green";
                        setTimeout(() => tg.close(), 1000);
                    } else {
                        status.innerText = "⚠️ Ошибка Direct";
                        btn.disabled = false;
                    }
                })
                .catch(e => {
                    status.innerText = "⚠️ Ошибка сети";
                    btn.disabled = false;
                });
            } else {
                status.innerText = "⚠️ Нет токена в HTML";
            }
        }
    </script>
</body>
</html>
